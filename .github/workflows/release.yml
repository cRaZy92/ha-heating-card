name: Release

# Every push to main publishes a GitHub release with heating-room-card.js attached,
# which HACS offers as an update. The version bumps automatically (see scripts/next-version.ts);
# raise the minor/major in package.json to start a new line. Put [skip release] in the
# commit message to push without releasing.
# The release notes (HA's changelog) are the subjects and bodies of the commits since the last
# release, so write commit messages for card users.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to compute the next version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      - name: Compute version
        id: version
        run: node scripts/next-version.ts >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"
      - run: npm run build
      - name: Release notes from commits since the last release
        run: node scripts/release-notes.ts > release-notes.md && cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/heating-room-card.js
          body_path: release-notes.md
